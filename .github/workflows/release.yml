name: release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # Docs-only changes don't ship to users and owe no version bump.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'backend/tests/**'

permissions:
  contents: read

env:
  VERSION_FILE: pyproject.toml

jobs:
  version-bumped:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version must advance
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"

          read_version() {
            python3 -c "import tomllib,sys; print(tomllib.load(open(sys.argv[1], 'rb'))['tool']['briefcase']['version'])" "$1"
          }

          if git cat-file -e "FETCH_HEAD:$VERSION_FILE" 2>/dev/null; then
            git show "FETCH_HEAD:$VERSION_FILE" > /tmp/base-pyproject.toml
            old=$(read_version /tmp/base-pyproject.toml)
          else
            echo "$VERSION_FILE does not exist on $BASE; treating as introduced by this PR."
            old=""
          fi
          new=$(read_version "$VERSION_FILE")

          if [ -z "$old" ]; then
            echo "$VERSION_FILE newly added at $new"
          elif [ "$old" = "$new" ]; then
            echo "::error::$VERSION_FILE version is still $old - bump it."
            exit 1
          elif [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | head -1)" != "$old" ]; then
            echo "::error::$new does not advance past $old."
            exit 1
          else
            echo "$old -> $new"
          fi

  tag-and-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag and release if the version is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib,sys; print(tomllib.load(open(sys.argv[1], 'rb'))['tool']['briefcase']['version'])" "$VERSION_FILE")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          target_args=()
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_sha=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              # This push didn't bump the version - completely normal (not
              # every push ships a new version). Don't fail; just make sure
              # the existing tag has a release.
              echo "::notice::$tag already exists at $tag_sha; this push ($GITHUB_SHA) did not bump the version."
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already tagged and released; nothing to do."
              exit 0
            fi
            echo "$tag exists (at $tag_sha) but has no release yet; creating it."
          else
            echo "$tag does not exist yet; creating it on $GITHUB_SHA."
            target_args=(--target "$GITHUB_SHA")
          fi

          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            "${target_args[@]}"
          echo "released=true" >> "$GITHUB_OUTPUT"

  # Runs only when this push created a release. A separate workflow on the
  # `release` event would never fire: releases made with GITHUB_TOKEN do not
  # trigger other workflows.
  docker-image:
    needs: tag-and-release
    if: needs.tag-and-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.tag-and-release.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
