# hg.voitta.ai — the Hedgehog API front door. Same app as bookmarklet.voitta.ai (127.0.0.1:12358);
# the app tells them apart by Host and only exposes the hg routes here (app.services.hg).
server {
    listen 80;
    listen [::]:80;
    server_name hg.voitta.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hg.voitta.ai;

    client_max_body_size 2M;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/hg.voitta.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hg.voitta.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:12358;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
}
